name: Phase 5 WebKit Worker origin diagnostics
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  inspect-webkit-origin-behavior:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check probe source syntax
        run: python3 -m py_compile tests/phase5_webkit_worker_origin_probe.py
      - name: Probe offline synthetic origins with WebKit (no external fetch)
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.58.0
          python3 tests/phase5_webkit_worker_origin_probe.py
      - name: Preserve origin diagnostics whether successful or not
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-worker-origin-probe-synthetic-only
          path: phase5_webkit_worker_origin_probe.json
          if-no-files-found: warn
