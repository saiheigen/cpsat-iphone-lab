# Standalone dynamic assignment CP-SAT -> real WebAssembly.
# Synthetic-only input. Does not change the already-proven fixed math probe.
name: Dynamic assignment CP-SAT WebAssembly build
on:
  push:
    paths:
      - '.github/workflows/cp-sat-wasm-dynamic.yml'
      - 'src/cp_sat_assignment_bridge.cc'
      - 'src/CMakeLists.txt'
      - 'tests/dynamic_assignment_wasm.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dynamic-cpsat:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.12'
      - name: Install compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3
          emcc --version
          node --version
      - name: Clone stable OR-Tools source for dynamic library
        run: |
          mkdir -p .build
          git clone --depth 1 --branch stable https://github.com/google/or-tools.git .build/or-tools
          git -C .build/or-tools rev-parse HEAD | tee .build/upstream_commit.txt
      - name: Apply reviewed Ninja protoc dependency repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path(".build/or-tools/cmake/host.cmake")
          s=f.read_text()
          old="OUTPUT ${CMAKE_CURRENT_BINARY_DIR}/host_tools\n"
          dep="DEPENDS ${CMAKE_CURRENT_BINARY_DIR}/host_tools\n"
          new="OUTPUT ${CMAKE_CURRENT_BINARY_DIR}/host_tools/bin/protoc\n"
          if s.count(old)!=1 or s.count(dep)!=1:
              raise SystemExit("Upstream changed: do not patch blindly")
          f.write_text(s.replace(old,new).replace(dep,new.replace("OUTPUT","DEPENDS")))
          PY
      - name: Configure only dynamic CP-SAT WASM dependencies
        run: |
          emcmake cmake -S src -B .build/dynamic -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DORTOOLS_SOURCE_DIR="${{ github.workspace }}/.build/or-tools" \
            -DBUILD_DEPS=ON -DBUILD_CXX=ON \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_SAMPLES=OFF \
            -DBUILD_PYTHON=OFF -DBUILD_JAVA=OFF -DBUILD_DOTNET=OFF \
            -DUSE_COINOR=OFF -DUSE_GLPK=OFF -DUSE_HIGHS=OFF \
            -DUSE_PDLP=OFF -DUSE_SCIP=OFF
      - name: Build only the dynamic assignment probe (not CLI binaries)
        run: |
          cmake --build .build/dynamic --target cp_sat_assignment_bridge --parallel 4
          test -s .build/dynamic/cp_sat_assignment_bridge.js
          test -s .build/dynamic/cp_sat_assignment_bridge.wasm
      - name: Execute true dynamic WASM CP-SAT and independent exact oracle
        run: |
          node tests/dynamic_assignment_wasm.cjs \
            .build/dynamic/cp_sat_assignment_bridge.js \
            .build/dynamic/cp_sat_assignment_bridge.wasm \
            .build/dynamic/dynamic_wasm_proof.json
      - name: Upload only a genuinely verified dynamic module
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-dynamic-cpsat-wasm-experimental
          path: |
            .build/dynamic/cp_sat_assignment_bridge.js
            .build/dynamic/cp_sat_assignment_bridge.wasm
            .build/dynamic/dynamic_wasm_proof.json
            .build/upstream_commit.txt
          include-hidden-files: true
          if-no-files-found: error
