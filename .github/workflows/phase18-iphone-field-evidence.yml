# Synthetic fixture-only schema gate; NEVER upload physical device reports to CI.
name: Phase 18 synthetic iPhone field evidence privacy gate
on:
  push:
    paths:
      - 'tools/validate_iphone_field_evidence.py'
      - 'tests/test_iphone_field_evidence.py'
      - '.github/workflows/phase18-iphone-field-evidence.yml'
  pull_request:
    paths:
      - 'tools/validate_iphone_field_evidence.py'
      - 'tests/test_iphone_field_evidence.py'
      - '.github/workflows/phase18-iphone-field-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-and-privacy-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate test and script syntax
        run: python3 -m py_compile tools/validate_iphone_field_evidence.py tests/test_iphone_field_evidence.py
      - name: Test mocked synthetic phone evidence and fail-closed certification
        run: python3 -m unittest discover -s tests -p test_iphone_field_evidence.py -v
      - name: Verify no personal evidence artifacts are uploaded
        run: |
          test ! -f physical_iphone_report.json
          echo "CI only tests invented report structures, never an actual user's iPhone data"
