name: Phase 5 synthetic integration boundary regression
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  synthetic-adapter-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tests/phase5_synthetic_adapter.test.cjs
          node tests/phase5_v7_preview.test.cjs
