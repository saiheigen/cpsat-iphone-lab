# Only a proven genuine CP-SAT WASM artifact may produce this iPhone file.
name: Package proven CP-SAT WASM for iPhone
on:
  workflow_run:
    workflows: ["Experimental CP-SAT WebAssembly", "Targeted CP-SAT WebAssembly build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful genuine CP-SAT WebAssembly workflow run ID"
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  package:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download the genuine Node-verified solver output
        uses: actions/download-artifact@v4
        with:
          name: genuine-cpsat-wasm-smoke-test
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: source
      - name: Re-execute genuine solver using Node and independent oracle
        shell: bash
        run: |
          set -euo pipefail
          # The artifact directory structure may differ between build flows.
          # Exactly one of each file is required. Never guess ambiguous inputs.
          mapfile -t js < <(find source -type f -name 'cp_sat_probe.js')
          mapfile -t wasm < <(find source -type f -name 'cp_sat_probe.wasm')
          mapfile -t proof < <(find source -type f -name 'real_smoke_result.json')
          test "${#js[@]}" -eq 1
          test "${#wasm[@]}" -eq 1
          test "${#proof[@]}" -eq 1
          test -s "${js[0]}" && test -s "${wasm[0]}" && test -s "${proof[0]}"
          printf 'CP_SAT_JS=%s\n' "${js[0]}" >> "$GITHUB_ENV"
          printf 'CP_SAT_WASM=%s\n' "${wasm[0]}" >> "$GITHUB_ENV"
          node build/real_solver_smoke.cjs \
            "${js[0]}" "${wasm[0]}" source/reverified.json
      - name: Create offline single-file iPhone HTML (only after proof gate)
        shell: bash
        run: |
          set -euo pipefail
          python3 build/package_iphone_cp_sat.py \
            "$CP_SAT_JS" "$CP_SAT_WASM" \
            source/reverified.json dist/iphone_cp_sat_real_smoke.html
          test -s dist/iphone_cp_sat_real_smoke.html
      - name: Publish phone test artifact
        uses: actions/upload-artifact@v4
        with:
          name: iphone-genuine-cp-sat-smoke-test
          path: |
            dist/iphone_cp_sat_real_smoke.html
            source/reverified.json
          if-no-files-found: error
