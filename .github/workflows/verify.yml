name: iPhone WASM baseline and native CP-SAT

on:
  push:
    branches: [main]
    # Avoid re-compiling the baseline for documentation-only edits or
    # changes to unrelated experimental workflows.
    paths:
      - '.github/workflows/verify.yml'
      - 'solver/**'
      - 'tests/**'
      - 'src/**'
      - 'build/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

# During active engineering, many closely spaced commits share the same
# verification scope. Avoid burning runner minutes compiling obsolete
# baseline runs; keep only the newest complete commit under test.
concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test iPhone packager rejection gates
        run: python3 -m unittest discover -s tests -p 'test_package_iphone.py' -v
      - name: Syntax-check both dynamic CP-SAT WASM acceptance scripts
        run: |
          node --check tests/dynamic_assignment_wasm.cjs
          node --check tests/month_real_wasm.cjs
      - name: Check full-month synthetic witness before real WASM build
        run: node tests/month_fixture_preflight.cjs
      - name: Independently preflight dense full-month synthetic reference (NOT WASM)
        run: |
          node --check tests/wasm_dense_month_benchmark.cjs
          node tests/wasm_dense_month_benchmark.cjs --preflight
      - name: Check new full-month fair-count fixture evidence (NOT real WASM)
        run: |
          node --check tests/month_fair_real_wasm.cjs
          node tests/month_fair_preflight.cjs
          node tests/month_fair_real_wasm.cjs --emit-browser-fixtures synthetic_fair_cases.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('synthetic_fair_cases.json').read_text())
          assert manifest['contract']=='guard-month-fair-v3'
          cases=manifest['cases']
          assert len(cases)==4
          for c in cases:
              assert c['synthetic_only'] is True
              assert len(c['mask'])==c['shifts']*c['staff']
              assert len(c['targets'])==c['staff']
          print('Four synthetic month fair fixtures are valid shapes; NOT actual WASM proof')
          PY
      - name: Check independent exact night/noon/long-hour v4 WASM oracle input (NOT compiled solver)
        run: |
          node --check tests/month_hardship_real_wasm.cjs
          node tests/month_hardship_real_wasm.cjs --preflight
      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.14'
      - name: Confirm compiler
        run: emcc --version
      - name: Build real WebAssembly as single file
        run: |
          mkdir -p dist
          emcc src/wasm_smoke.c -O2 -sWASM=1 -sSINGLE_FILE=1 -sMODULARIZE=1 -sEXPORT_NAME=createSmokeModule -sENVIRONMENT=web,worker,node -sEXPORTED_FUNCTIONS='["_smoke_add"]' -o dist/smoke.js
          node tests/smoke_node.cjs
          python3 scripts/package_single_html.py dist/smoke.js dist/iphone_smoke.html
          test -s dist/iphone_smoke.html
      - name: Upload iPhone single-file baseline (NOT CP-SAT)
        uses: actions/upload-artifact@v4
        with:
          name: iphone-wasm-baseline
          path: dist/iphone_smoke.html
          if-no-files-found: error

  native-cpsat:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official native OR-Tools
        run: python -m pip install --disable-pip-version-check ortools==9.15.6755
      - name: Verify synthetic monthly roster rules and native CP-SAT model
        run: python -m unittest discover -s tests -p 'test_roster_cp_sat.py' -v
      - name: Test three-stage quota, carryover and hardship optimization
        run: python -m unittest discover -s tests -p 'test_fairness_cp_sat.py' -v
      - name: Validate real v7 backup layout with fictional data
        run: python -m unittest discover -s tests -p 'test_v7_backup_bridge.py' -v
      - name: Verify legal constructive CP-SAT hints against independent audit
        run: python -m unittest discover -s tests -p 'test_constructive_witness.py' -v
      - name: Test full-coverage-first split solver and legal deficit fallback
        run: python -m unittest discover -s tests -p 'test_split_fill_cp_sat.py' -v
      - name: Audit v7 full-month preview shape and refuse unsafe imports
        run: python -m unittest discover -s tests -p 'test_v7_preview.py' -v
      - name: Verify bounded anonymous Python-to-WASM bridge contract
        run: python -m unittest discover -s tests -p 'test_wasm_assignment_adapter.py' -v
      - name: Verify dynamic offline WASM packaging proof gate (fake fixture only)
        run: python -m unittest discover -s tests -p 'test_package_dynamic_assignment.py' -v
      - name: Check complete 589-shift month wire serialization and historical availability
        run: python -m unittest discover -s tests -p 'test_full_month_wire_v2.py' -v
      - name: Verify proof-gated full-month offline HTML packager (fake fixture only)
        run: python -m unittest discover -s tests -p 'test_package_full_month_wasm.py' -v
      - name: Verify v7 fairness share targets and archived 1-to-1 credits
        run: python -m unittest discover -s tests -p 'test_fairness_targets_v7.py' -v
      - name: Test lexicographic native CP-SAT coverage before soft count fairness
        run: python -m unittest discover -s tests -p 'test_lexicographic_count_fair.py' -v
      - name: Validate new anonymous v3 fair-count target transport and forged-result rejection
        run: python -m unittest discover -s tests -p 'test_full_month_fair_wire_v3.py' -v
      - name: Verify two-stage fair-count WASM packaging proof gate with fake synthetic fixtures
        run: python -m unittest discover -s tests -p 'test_package_month_fair_wasm.py' -v
      - name: Independently verify third-stage night/noon/long-hour hardship CP-SAT exact oracles (native only)
        run: python -m unittest discover -s tests -p 'test_hardship_stage_v4.py' -v
      - name: Verify strict three-stage hardship WASM release gate (FAKE fixture, not solver proof)
        run: python -m unittest discover -s tests -p 'test_package_month_hardship_wasm.py' -v
      - name: Run real native CP-SAT OPTIMAL test (NOT WASM)
        run: python tests/native_cpsat.py | tee native_cpsat_result.json
      - name: Upload native CP-SAT evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-cpsat-result
          path: native_cpsat_result.json
          if-no-files-found: error
