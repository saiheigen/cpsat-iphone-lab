# Only after real 589-month WASM Node and HTML proof gates succeed.
# Browser is actual offline Chromium, NOT iPhone/Safari hardware validation.
name: Real offline 589-shift CP-SAT WASM browser acceptance
on:
  workflow_run:
    workflows: ["Package proven full-month CP-SAT WASM demo"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful month HTML packaging workflow run ID"
        type: string
        required: true
permissions:
  actions: read
  contents: read
jobs:
  genuine-month-browser:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch proof-gated genuine 589-shift CP-SAT offline HTML
        uses: actions/download-artifact@v4
        with:
          name: genuine-589-shift-cpsat-wasm-offline-demo
          run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.source_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: received
      - name: Install Playwright matching preinstalled Chromium
        run: python -m pip install --disable-pip-version-check playwright==1.58.0
      - name: Test real 589-month WASM including legal and prohibited duty scenarios
        shell: bash
        run: |
          set -euo pipefail
          test "$(find received -type f -name experimental_full_month_cp_sat.html | wc -l)" -eq 1
          html="$(find received -type f -name experimental_full_month_cp_sat.html)"
          test -s "$html"
          python tests/browser_full_month_wasm.py "$html"
      - name: Keep acceptance JSON or failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-month-cpsat-offline-browser-proof
          path: |
            month_browser_proof.json
            month-*-failure.png
          if-no-files-found: warn
