# Fictional 589-shift stress: no personal or real operational records.
name: Split 589-shift synthetic absence stress
on:
  push:
    paths:
      - '.github/workflows/benchmark-absences.yml'
      - 'benchmarks/split_absence_589.py'
      - 'solver/split_fill_cp_sat.py'
      - 'solver/constructive_witness.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-589-absences:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official native CP-SAT
        run: python -m pip install --disable-pip-version-check ortools==9.15.6755
      - name: Stress test legal synthetic December roster with conflicts and time limits
        run: python -m benchmarks.split_absence_589
      - name: Store result including FEASIBLE or UNKNOWN without false claims
        uses: actions/upload-artifact@v4
        with:
          name: split-synthetic-589-absences
          path: split_absence_589.json
          if-no-files-found: error
