# THIRD STAGE: 589-shift fill + count fairness + normalized hardship CP-SAT -> real WASM.
# Synthetic-only input. Does not change the already-proven fixed math probe.
name: Full-month three-stage hardship CP-SAT WASM experiment
on:
  push:
    branches: [main, fix/v4-validated-incumbent, test/door30-abort, feat/door-two-duty-days]
    paths:
      - '.github/workflows/cp-sat-wasm-harsh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-calendar:
    # Genuine dynamic assignment run #1 already passed the Node oracle.
    # Run one full-month compile on workflow revision, rather than one compile
    # for every earlier concurrent dynamic job completing.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fail fast on exact hardship oracle and 589-shift input protocol
        run: |
          node --check tests/month_hardship_real_wasm.cjs
          node tests/month_hardship_real_wasm.cjs --preflight
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.12'
      - name: Install compiler and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build git python3
          emcc --version
          node --version
      - name: Clone stable OR-Tools source for dynamic library
        run: |
          mkdir -p .build
          git init .build/or-tools
          git -C .build/or-tools fetch --depth=1 https://github.com/google/or-tools.git 100f66e6242ab8bf8d32feb8f3bf086db66ae2b5
          git -C .build/or-tools checkout --detach FETCH_HEAD
          git -C .build/or-tools apply "$GITHUB_WORKSPACE/build/ortools-hint-load-timeout.patch"
          git -C .build/or-tools rev-parse HEAD | tee .build/upstream_commit.txt
      - name: Apply reviewed Ninja protoc dependency repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          f=Path(".build/or-tools/cmake/host.cmake")
          s=f.read_text()
          old="OUTPUT ${CMAKE_CURRENT_BINARY_DIR}/host_tools\n"
          dep="DEPENDS ${CMAKE_CURRENT_BINARY_DIR}/host_tools\n"
          new="OUTPUT ${CMAKE_CURRENT_BINARY_DIR}/host_tools/bin/protoc\n"
          if s.count(old)!=1 or s.count(dep)!=1:
              raise SystemExit("Upstream changed: do not patch blindly")
          f.write_text(s.replace(old,new).replace(dep,new.replace("OUTPUT","DEPENDS")))
          PY
      - name: Configure three-stage hardship OR-Tools CP-SAT WASM dependencies
        run: |
          emcmake cmake -S src -B .build/dynamic -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DORTOOLS_SOURCE_DIR="${{ github.workspace }}/.build/or-tools" \
            -DBUILD_DEPS=ON -DBUILD_CXX=ON \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_TESTING=OFF \
            -DBUILD_EXAMPLES=OFF -DBUILD_SAMPLES=OFF \
            -DBUILD_PYTHON=OFF -DBUILD_JAVA=OFF -DBUILD_DOTNET=OFF \
            -DUSE_COINOR=OFF -DUSE_GLPK=OFF -DUSE_HIGHS=OFF \
            -DUSE_PDLP=OFF -DUSE_SCIP=OFF
      - name: Compile only standalone 3-phase month hardship WASM target (not OR-Tools CLI)
        run: |
          cmake --build .build/dynamic --target cp_sat_month_hardship_bridge --parallel 4
          test -s .build/dynamic/cp_sat_month_hardship_bridge.js
          test -s .build/dynamic/cp_sat_month_hardship_bridge.wasm
      - name: Test consecutive door days and calendar boundaries
        run: node tests/door-run-length.cjs .build/dynamic/cp_sat_month_hardship_bridge.js .build/dynamic/cp_sat_month_hardship_bridge.wasm
      - name: Actually execute 3-phase full-month hardship WASM and independent audits
        run: |
          node tests/month_hardship_real_wasm.cjs \
            .build/dynamic/cp_sat_month_hardship_bridge.js \
            .build/dynamic/cp_sat_month_hardship_bridge.wasm \
            .build/dynamic/full_month_hardship_wasm_proof.json
      - name: Check workload and hardship guards on seven paired 28 percent matrices
        run: |
          node tests/month_fair_retry_benchmark.cjs \
            .build/dynamic/cp_sat_month_hardship_bridge.js \
            .build/dynamic/cp_sat_month_hardship_bridge.wasm \
            .build/dynamic/matrix_seed_results.json
      - name: Replay synthetic 30-person door frame ten times
        run: |
          node tests/door-abort-stress.cjs \
            .build/dynamic/cp_sat_month_hardship_bridge.js \
            .build/dynamic/cp_sat_month_hardship_bridge.wasm \
            tests/fixtures/page-door30-november.txt
      - name: Publish genuine full-month three-phase hardship WASM only after real tests
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-full-month-harsh-cpsat-wasm-with-proof
          path: |
            .build/dynamic/cp_sat_month_hardship_bridge.js
            .build/dynamic/cp_sat_month_hardship_bridge.wasm
            .build/dynamic/full_month_hardship_wasm_proof.json
            .build/dynamic/matrix_seed_results.json
            .build/upstream_commit.txt
          include-hidden-files: true
          if-no-files-found: error
      - name: Compare paired counts and L1 before accepting candidate
        run: node tests/month_fair_retry_benchmark.cjs --check .build/dynamic/matrix_seed_results.json
